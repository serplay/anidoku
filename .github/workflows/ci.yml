name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast, dependency-light gate on the pure-Rust core: format, lint, and the
  # full unit-test suite (the live network tests are #[ignore]d and run only in
  # the scheduled provider-health workflow). Scoped to the core crate on
  # purpose: the app crate needs the system webkit/GTK libraries, which this
  # job does not install — the app is linted and tested in `tauri-check`.
  core:
    name: core (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        run: cargo clippy -p anidoku-core --all-targets -- -D warnings
      - name: test
        run: cargo test -p anidoku-core

  # The Svelte/TypeScript frontend: type + template checks.
  frontend:
    name: frontend (svelte-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  # Playwright E2E: drives the SvelteKit frontend in Chromium with the Tauri IPC
  # layer mocked (no Rust backend needed). Covers routing, search, and the
  # player's no-sources / quality-switch / playback-error paths.
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The allanime rotation oracle (scripts/allanime-oracle) must not bit-rot
  # silently: type-strip/parse it, and prove allanime-config.json and the
  # baked-in constants are in lockstep by running the applier as a no-op.
  oracle-smoke:
    name: oracle (parse + config/constants lockstep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Parse derive.ts (no network)
        run: node --experimental-strip-types --no-warnings --check scripts/allanime-oracle/derive.ts
      # Syntax-checking derive.ts cannot catch a logic bug in the signature
      # tokeniser, and one such bug (a hard-coded ':' separator) cost a 4.5-day
      # streaming outage. Run its unit tests over recorded signatures.
      - name: Oracle unit tests (signature tokeniser)
        run: npm run test:oracle
      - name: allanime-config.json ↔ constants.rs lockstep
        run: |
          npm run -s oracle:apply
          git diff --exit-code -- core/src/provider/allanime/constants.rs

  # Lint and test the full Tauri desktop app (pulls in the system webkit deps).
  # No bundle — that isn't needed to catch breakage on the Rust side. This is
  # the only job with the system libraries installed, so the workspace-wide
  # clippy and the app crate's own tests live here rather than in `core`.
  tauri-check:
    name: tauri app (clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            file \
            libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: clippy (workspace, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (app crate)
        run: cargo test -p anidoku
