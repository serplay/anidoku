[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
reqwest = { version = "0.12", features = ["json", "gzip", "stream"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
