[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
socket2 = "0.5"
# rustls (not native-tls): openssl-sys does not cross-compile for Android.
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "stream", "rustls-tls", "http2", "charset"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
