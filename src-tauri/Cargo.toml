[package]
name = "anidoku"
version = "0.1.0"
edition = "2021"
description = "AniDoku desktop shell"
license = "GPL-3.0-only"

[lib]
name = "anidoku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anidoku-core = { path = "../core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
socket2 = { workspace = true }
urlencoding = "2"
dirs = "5"

[target.'cfg(target_os = "android")'.dependencies]
# JNI glue for the download foreground service (src/android.rs). Must track
# the jni version wry uses (with_webview hands us its JNIEnv).
jni = "0.21"
